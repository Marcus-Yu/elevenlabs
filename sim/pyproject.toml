[project]
name = "atlas-sim"
version = "0.1.0"
description = "Atlas pitch simulation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edsl==1.0.9",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.80,<0.81"]
openai = ["openai[aiohttp]>=2.44,<3"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
